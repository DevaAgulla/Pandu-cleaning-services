<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Admin Sign In | Pandu Cleaning Services</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='26' fill='%230fa3a0'/%3E%3Cpath d='M50 20l7 18 18 7-18 7-7 18-7-18-18-7 18-7z' fill='white'/%3E%3C/svg%3E">
<link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/plus-jakarta-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/css/fonts.css">
<link rel="stylesheet" href="/css/admin.css">
</head>
<body class="login-page">

  <main class="login-card">
    <div class="login-brand">
      <span class="login-mark">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9L12 3z" fill="currentColor"/>
        </svg>
      </span>
      <div>
        <h1>Pandu Cleaning</h1>
        <p>Admin panel</p>
      </div>
    </div>

    <!--{{WARNING}}-->
    <!--{{ERROR}}-->

    <form method="POST" action="/admin/login" autocomplete="on">
      <input type="hidden" name="_csrf" value="<!--{{CSRF}}-->">

      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" autocomplete="username"
               required autofocus spellcheck="false">
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
      </div>

      <button class="btn btn--primary btn--block" type="submit">Sign In</button>
    </form>

    <p class="login-foot"><a href="/">&larr; Back to website</a></p>
  </main>

</body>
</html>
